<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SLINK PDA Overlay Preview</title>
  <style>
    html,body{min-height:100%;margin:0;background:#171717;color:#ddd;font:14px Arial,sans-serif}header{height:54px;background:linear-gradient(#444,#222);border-bottom:1px solid #555}main{max-width:980px;margin:auto;padding:18px}.torn-card{min-height:180px;margin:12px 0;border:1px solid #444;border-radius:6px;background:#252525}.torn-card h2{margin:0;padding:12px;border-bottom:1px solid #444}.torn-card p{padding:12px;color:#aaa}.note{padding:10px;border-left:4px solid #4b98d0;background:#1b2833}
  </style>
</head>
<body>
  <header></header>
  <main><p class="note">Local Torn-like fixture. Tap the SLINK bubble to open the PDA dashboard.</p><section class="torn-card"><h2>Torn content remains underneath</h2><p>The overlay does not navigate or refresh this page. Minimize it to immediately return here.</p></section><section class="torn-card"><h2>Faction</h2><p>Placeholder content for scroll and overlay testing.</p></section></main>
  <script>
    if (new URLSearchParams(location.search).get('fixture') === 'merits') {
      const awards = Array.from({length:55}, (_, index) => ({
        id:index + 1,
        name:`${index % 2 ? 'Honor' : 'Medal'} milestone ${index + 1}`,
        description:`Complete ${((index + 1) * 50).toLocaleString()} qualifying actions`,
        type:{id:(index % 7) + 1,title:['Attacking','Crimes','Commitment','Rank','Level','Networth','General'][index % 7]}
      }));
      localStorage.setItem('slink-pda-dashboard:ui:v1', JSON.stringify({page:'efficiency',efficiencyTab:'merits'}));
      localStorage.setItem('slink-pda-dashboard:data:v1', JSON.stringify({
        sessions:{permission:{token:'preview',expiresAt:Date.now()+86400000,userId:1,userName:'Preview',scopes:['slink.adhd.alerts','admin.*']}},
        caches:{
          alerts:{at:Date.now(),cityBought:100,stockCatalog:{stocks:[]},body:{bars:{energy:{current:150,maximum:150},nerve:{current:10,maximum:50}},cooldowns:{drug:900,medical:900,booster:900},refills:{energy:{available:false},nerve:{available:false}},missions:{givers:[]},stocks:[],battlestats:{}}},
          merits:{at:Date.now(),data:{player:{medals:[],honors:[]},personalStats:{},catalog:{medals:awards.filter((_,index)=>index%2===0),honors:awards.filter((_,index)=>index%2===1)}}}
        },
        settings:{merits:{refreshMinutes:15,filter:'all',page:1,pageSize:20,pinned:[]}}
      }));
    }
  </script>
  <script src="SLINK_PDA_Dashboard.user.js"></script>
</body>
</html>
