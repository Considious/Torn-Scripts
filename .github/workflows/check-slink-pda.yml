name: Build and check SLINK PDA

on:
  push:
    branches: [main]
    paths:
      - 'SLINK-PDA/src/**'
      - 'SLINK-PDA/build.mjs'
      - 'SLINK-PDA/package.json'
      - 'SLINK-PDA/source-manifest.json'
      - '.github/workflows/check-slink-pda.yml'
  pull_request:
    paths:
      - 'SLINK-PDA/**'
      - '.github/workflows/check-slink-pda.yml'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix SLINK-PDA --no-package-lock
      - run: npm --prefix SLINK-PDA run build
      - run: npm --prefix SLINK-PDA test
      - name: Require committed build in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- SLINK-PDA/SLINK_PDA_Dashboard.user.js
      - name: Publish generated userscript
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- SLINK-PDA/SLINK_PDA_Dashboard.user.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SLINK-PDA/SLINK_PDA_Dashboard.user.js
          git commit -m "Build PDA userscript 0.4.42 [skip ci]"
          git push
