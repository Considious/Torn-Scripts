name: Apply Slinky Debug Panel

on:
  push:
    branches:
      - feature/slinky-debug-panel
    paths:
      - '.github/workflows/apply-slinky-debug-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slinky-debug-panel

      - name: Patch userscript
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      0.2.2', '// @version      0.3.0', 1)

          text = text.replace(
              "        settingsOpen: false,\n",
              "        settingsOpen: false,\n        debugOpen: false,\n",
              1,
          )

          style_anchor = """            .slp-empty { padding:16px; text-align:center; color:#aaa; }\n            .slp-footer { padding:6px 8px; color:#888; border-top:1px solid rgba(255,255,255,.08); font-size:10px; }\n"""
          style_replacement = """            .slp-empty { padding:16px; text-align:center; color:#aaa; }\n            .slp-debug { padding:9px; border-bottom:1px solid rgba(255,255,255,.1); background:#181c22; }\n            .slp-debug-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:5px 10px; margin-bottom:7px; }\n            .slp-debug-line { display:flex; justify-content:space-between; gap:8px; color:#bbb; }\n            .slp-debug-line b { color:#fff; }\n            .slp-debug-actions { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:7px; }\n            .slp-debug textarea { width:100%; min-height:180px; resize:vertical; border:1px solid #454b55; border-radius:5px; background:#0f1216; color:#d8d8d8; padding:7px; font:11px/1.35 Consolas, monospace; }\n            .slp-footer { padding:6px 8px; color:#888; border-top:1px solid rgba(255,255,255,.08); font-size:10px; }\n"""
          if style_anchor not in text:
              raise SystemExit('Style anchor not found')
          text = text.replace(style_anchor, style_replacement, 1)

          render_anchor = """                <button class=\"slp-btn\" id=\"slp-settings-btn\">⚙</button>\n                <button class=\"slp-btn\" id=\"slp-collapse\">${settings.collapsed ? '＋' : '−'}</button>\n"""
          render_replacement = """                <button class=\"slp-btn\" id=\"slp-debug-btn\">Data</button>\n                <button class=\"slp-btn\" id=\"slp-settings-btn\">⚙</button>\n                <button class=\"slp-btn\" id=\"slp-collapse\">${settings.collapsed ? '＋' : '−'}</button>\n"""
          if render_anchor not in text:
              raise SystemExit('Render button anchor not found')
          text = text.replace(render_anchor, render_replacement, 1)

          body_anchor = """                ${state.lastError ? `<div class=\"slp-error\">${escapeHtml(state.lastError)}</div>` : ''}\n                ${state.settingsOpen ? settingsHtml(settings) : ''}\n                <div id=\"slp-targets\">${targetsHtml(targets)}</div>\n"""
          body_replacement = """                ${state.lastError ? `<div class=\"slp-error\">${escapeHtml(state.lastError)}</div>` : ''}\n                ${state.settingsOpen ? settingsHtml(settings) : ''}\n                ${state.debugOpen ? debugHtml() : ''}\n                <div id=\"slp-targets\">${targetsHtml(targets)}</div>\n"""
          if body_anchor not in text:
              raise SystemExit('Render body anchor not found')
          text = text.replace(body_anchor, body_replacement, 1)

          func_anchor = """    function targetsHtml(targets) {\n"""
          debug_funcs = r'''    function buildDebugData() {
        const statusEntries = Object.values(state.statusCache || {});
        const statusCounts = {};

        for (const entry of statusEntries) {
            const status = normalizeStatus(entry?.state || 'Unknown');
            statusCounts[status] = (statusCounts[status] || 0) + 1;
        }

        let hospitalizationEvents24h = 0;
        for (const id of Object.keys(state.hospitalHistory || {})) {
            hospitalizationEvents24h += hospitalCount24h(id);
        }

        const recentChecks = Object.entries(state.statusCache || {})
            .map(([id, record]) => {
                const target = state.master.find(item => item.id === id);
                return {
                    id,
                    name: target?.name || 'Unknown',
                    state: normalizeStatus(record?.state || 'Unknown'),
                    checkedAt: Number(record?.checkedAt) || 0
                };
            })
            .sort((a, b) => b.checkedAt - a.checkedAt)
            .slice(0, 20);

        return {
            scriptVersion: '0.3.0',
            coreLibVersion: TornLib.VERSION,
            leaderTab: Boolean(state.leader?.isLeader()),
            masterTargets: state.master.length,
            activeUnder7Days: activeExcludedCount(),
            statusRecords: statusEntries.length,
            statusCounts,
            hospitalizationEvents24h,
            ffScouterRecords: Object.keys(state.ffCache || {}).length,
            activitySnapshotRefreshedAt: Number(state.activityCache?.refreshedAt) || 0,
            activitySnapshotCount: Array.isArray(state.activityCache?.snapshots) ? state.activityCache.snapshots.length : 0,
            lastPrimaryPollAt: state.lastCycleAt,
            lastPrimaryChecked: state.lastCycleChecked,
            lastPrimaryOkay: state.lastCycleOkay,
            lastBackgroundPollAt: state.lastBackgroundAt,
            lastBackgroundChecked: state.lastBackgroundChecked,
            lastError: state.lastError || '',
            recentChecks
        };
    }

    function debugText() {
        const data = buildDebugData();
        const lines = [
            `Slinky Leveling Target Prototype v${data.scriptVersion}`,
            `CoreLib: ${data.coreLibVersion}`,
            `Polling tab: ${data.leaderTab ? 'Yes' : 'No'}`,
            '',
            `Master targets loaded: ${data.masterTargets}`,
            `Active <7d excluded: ${data.activeUnder7Days}`,
            `Cached status records: ${data.statusRecords}`,
            `  Okay: ${data.statusCounts.Okay || 0}`,
            `  Hospital: ${data.statusCounts.Hospital || 0}`,
            `  Traveling: ${data.statusCounts.Traveling || 0}`,
            `  Abroad: ${data.statusCounts.Abroad || 0}`,
            `  Jail: ${data.statusCounts.Jail || 0}`,
            `  Federal: ${data.statusCounts.Federal || 0}`,
            `  Unknown/Other: ${data.statusRecords - Object.entries(data.statusCounts).filter(([key]) => ['Okay','Hospital','Traveling','Abroad','Jail','Federal'].includes(key)).reduce((sum, [, count]) => sum + count, 0)}`,
            `Hospitalization events observed in 24h: ${data.hospitalizationEvents24h}`,
            `FFScouter cached records: ${data.ffScouterRecords}`,
            `Activity snapshots cached: ${data.activitySnapshotCount}`,
            `Activity snapshot refreshed: ${data.activitySnapshotRefreshedAt ? new Date(data.activitySnapshotRefreshedAt).toLocaleString() : 'Never'}`,
            '',
            `Primary poll: ${data.lastPrimaryPollAt ? new Date(data.lastPrimaryPollAt).toLocaleString() : 'Never'} | checked ${data.lastPrimaryChecked} | Okay ${data.lastPrimaryOkay}`,
            `Background poll: ${data.lastBackgroundPollAt ? new Date(data.lastBackgroundPollAt).toLocaleString() : 'Never'} | checked ${data.lastBackgroundChecked}`,
            `Last error: ${data.lastError || 'None'}`,
            '',
            'Most recent status checks:'
        ];

        for (const row of data.recentChecks) {
            lines.push(`${row.checkedAt ? new Date(row.checkedAt).toLocaleString() : 'Never'} | ${row.name} [${row.id}] | ${row.state}`);
        }

        return lines.join('\n');
    }

    function debugHtml() {
        const data = buildDebugData();
        const okay = data.statusCounts.Okay || 0;
        const hospital = data.statusCounts.Hospital || 0;
        const traveling = data.statusCounts.Traveling || 0;
        const jail = data.statusCounts.Jail || 0;

        return `
            <div class="slp-debug">
                <div class="slp-debug-grid">
                    <div class="slp-debug-line"><span>Master loaded</span><b>${data.masterTargets}</b></div>
                    <div class="slp-debug-line"><span>Active &lt;7d</span><b>${data.activeUnder7Days}</b></div>
                    <div class="slp-debug-line"><span>Status cached</span><b>${data.statusRecords}</b></div>
                    <div class="slp-debug-line"><span>FF cached</span><b>${data.ffScouterRecords}</b></div>
                    <div class="slp-debug-line"><span>Okay</span><b>${okay}</b></div>
                    <div class="slp-debug-line"><span>Hospital</span><b>${hospital}</b></div>
                    <div class="slp-debug-line"><span>Traveling</span><b>${traveling}</b></div>
                    <div class="slp-debug-line"><span>Jail</span><b>${jail}</b></div>
                    <div class="slp-debug-line"><span>Hosp events 24h</span><b>${data.hospitalizationEvents24h}</b></div>
                    <div class="slp-debug-line"><span>Snapshots</span><b>${data.activitySnapshotCount}</b></div>
                </div>
                <div class="slp-debug-actions">
                    <button class="slp-btn" id="slp-copy-debug">Copy Debug Data</button>
                    <button class="slp-btn" id="slp-refresh-debug">Refresh View</button>
                </div>
                <textarea id="slp-debug-text" readonly>${escapeHtml(debugText())}</textarea>
            </div>
        `;
    }

'''
          if func_anchor not in text:
              raise SystemExit('targetsHtml anchor not found')
          text = text.replace(func_anchor, debug_funcs + func_anchor, 1)

          bind_anchor = """        panel.querySelector('#slp-settings-btn')?.addEventListener('click', () => {\n            state.settingsOpen = !state.settingsOpen;\n            render();\n        });\n\n"""
          bind_replacement = """        panel.querySelector('#slp-debug-btn')?.addEventListener('click', () => {\n            state.debugOpen = !state.debugOpen;\n            render();\n        });\n\n        panel.querySelector('#slp-settings-btn')?.addEventListener('click', () => {\n            state.settingsOpen = !state.settingsOpen;\n            render();\n        });\n\n        panel.querySelector('#slp-copy-debug')?.addEventListener('click', async event => {\n            const button = event.currentTarget;\n            const original = button.textContent;\n            try {\n                await TornLib.copyText(debugText());\n                button.textContent = 'Copied!';\n            } catch (error) {\n                button.textContent = 'Copy failed';\n                state.lastError = `Debug copy: ${TornLib.errorMessage(error)}`;\n            }\n            setTimeout(() => {\n                if (button.isConnected) button.textContent = original;\n            }, 1400);\n        });\n\n        panel.querySelector('#slp-refresh-debug')?.addEventListener('click', () => render());\n\n"""
          if bind_anchor not in text:
              raise SystemExit('bindEvents anchor not found')
          text = text.replace(bind_anchor, bind_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check and commit
        run: |
          node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Add Slinky leveling data debug panel"
          git push origin HEAD:feature/slinky-debug-panel
