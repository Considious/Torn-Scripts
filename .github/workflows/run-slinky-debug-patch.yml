name: Run Slinky Debug Patch

on:
  push:
    branches:
      - feature/slinky-debug-panel
    paths:
      - '.github/workflows/run-slinky-debug-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slinky-debug-panel
      - run: python Slinkies-Leveling-Targets/tools/patch_debug_panel.py
      - run: node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Add Slinky leveling data debug panel"
          git push origin HEAD:feature/slinky-debug-panel
