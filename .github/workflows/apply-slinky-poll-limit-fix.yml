name: Apply Slinky Poll Limit Fix

on:
  push:
    branches:
      - fix/slinky-poll-count
    paths:
      - '.github/workflows/apply-slinky-poll-limit-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/slinky-poll-count

      - name: Patch userscript poll counts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      0.3.1', '// @version      0.3.2', 1)
          text = text.replace('    const PRIMARY_CHECKS = 40;\n    const BACKGROUND_DEFAULT_CHECKS = 10;', '    const PRIMARY_DEFAULT_CHECKS = 10;\n    const BACKGROUND_DEFAULT_CHECKS = 0;', 1)

          text = text.replace(
              "        backgroundChecks: 'slinkyLeveling.backgroundChecks',\n",
              "        primaryChecks: 'slinkyLeveling.primaryChecks',\n        backgroundChecks: 'slinkyLeveling.backgroundChecks',\n",
              1,
          )

          text = text.replace(
              "            backgroundChecks: clamp(Number(GM_getValue(KEYS.backgroundChecks, BACKGROUND_DEFAULT_CHECKS)) || BACKGROUND_DEFAULT_CHECKS, 10, 40),\n",
              "            primaryChecks: clamp(Number(GM_getValue(KEYS.primaryChecks, PRIMARY_DEFAULT_CHECKS)) || PRIMARY_DEFAULT_CHECKS, 5, 40),\n            backgroundChecks: clamp(Number(GM_getValue(KEYS.backgroundChecks, BACKGROUND_DEFAULT_CHECKS)) || 0, 0, 20),\n",
              1,
          )

          text = text.replace(
              "        GM_setValue(KEYS.backgroundChecks, clamp(Number(values.backgroundChecks) || BACKGROUND_DEFAULT_CHECKS, 10, 40));\n",
              "        GM_setValue(KEYS.primaryChecks, clamp(Number(values.primaryChecks) || PRIMARY_DEFAULT_CHECKS, 5, 40));\n        GM_setValue(KEYS.backgroundChecks, clamp(Number(values.backgroundChecks) || 0, 0, 20));\n",
              1,
          )

          text = text.replace('            const candidates = chooseCandidates(PRIMARY_CHECKS);', '            const candidates = chooseCandidates(settings.primaryChecks);', 1)
          text = text.replace('            const primaryIds = new Set(chooseCandidates(PRIMARY_CHECKS).map(target => target.id));', "            if (settings.backgroundChecks <= 0) {\n                state.lastBackgroundChecked = 0;\n                scheduleBackgroundPoll();\n                return;\n            }\n\n            const primaryIds = new Set(chooseCandidates(settings.primaryChecks).map(target => target.id));", 1)

          old_settings = '''                <label>Background checks\n                    <input id="slp-background-checks" type="number" min="10" max="40" value="${settings.backgroundChecks}">\n                </label>\n                <label>Poll seconds'''
          new_settings = '''                <label>Checks per poll\n                    <input id="slp-primary-checks" type="number" min="5" max="40" value="${settings.primaryChecks}">\n                </label>\n                <label>Background checks / 5m\n                    <input id="slp-background-checks" type="number" min="0" max="20" value="${settings.backgroundChecks}">\n                </label>\n                <label>Poll seconds'''
          if old_settings not in text:
              raise SystemExit('Settings UI anchor not found')
          text = text.replace(old_settings, new_settings, 1)

          text = text.replace(
              "                backgroundChecks: panel.querySelector('#slp-background-checks')?.value,\n",
              "                primaryChecks: panel.querySelector('#slp-primary-checks')?.value,\n                backgroundChecks: panel.querySelector('#slp-background-checks')?.value,\n",
              1,
          )

          text = text.replace("            scriptVersion: '0.3.1',", "            scriptVersion: '0.3.2',", 1)
          text = text.replace(
              "            leaderTab: Boolean(state.leader?.isLeader()),\n",
              "            leaderTab: Boolean(state.leader?.isLeader()),\n            primaryChecksConfigured: getSettings().primaryChecks,\n            backgroundChecksConfigured: getSettings().backgroundChecks,\n            pollSecondsConfigured: getSettings().pollSeconds,\n",
              1,
          )
          text = text.replace(
              "            `Polling tab: ${data.leaderTab ? 'Yes' : 'No'}`,\n",
              "            `Polling tab: ${data.leaderTab ? 'Yes' : 'No'}`,\n            `Configured polling: ${data.primaryChecksConfigured} checks every ${data.pollSecondsConfigured}s`,\n            `Background sampling: ${data.backgroundChecksConfigured} checks every 5m`,\n",
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check and commit
        run: |
          node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Make Slinky poll count configurable"
          git push origin HEAD:fix/slinky-poll-count
