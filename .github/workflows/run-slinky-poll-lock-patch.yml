name: Run Slinky Poll Lock Patch
on:
  push:
    paths:
      - '.github/workflows/run-slinky-poll-lock-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python Slinkies-Leveling-Targets/tools/patch_poll_lock_051.py
      - run: node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Prevent duplicate concurrent Slinky status polling"
          git push
