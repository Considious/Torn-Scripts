name: Fix Slinky Status Precedence

on:
  push:
    branches:
      - feature/slinky-smart-scheduler-045
    paths:
      - '.github/workflows/patch-slinky-status-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix status precedence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')
          old = """        if (lower.includes('federal')) return 'Federal';\n        if (lower.includes('hiding out') || lower.includes('hiding')) return 'Hiding Out';\n        if (lower === 'okay' || lower.includes('okay')) return 'Okay';\n        if (lower.includes('hospital')) return 'Hospital';\n        if (lower.includes('travel') || lower.includes('flying')) return 'Traveling';\n        if (lower.includes('abroad')) return 'Abroad';\n        if (lower.includes('jail')) return 'Jail';"""
          new = """        if (lower.includes('federal')) return 'Federal';\n        if (lower.includes('hiding out') || lower.includes('hiding')) return 'Hiding Out';\n        if (lower.includes('hospital')) return 'Hospital';\n        if (lower.includes('travel') || lower.includes('flying')) return 'Traveling';\n        if (lower.includes('abroad')) return 'Abroad';\n        if (lower.includes('jail')) return 'Jail';\n        if (lower === 'okay' || lower.includes('okay')) return 'Okay';"""
          if old not in text:
              raise SystemExit('Could not find normalizeStatus ordering block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Fix scheduler status precedence"
          git push
