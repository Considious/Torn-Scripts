name: Patch Slinky Leveling Free Movement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-slinky-leveling-free-movement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch prototype
        shell: python
        run: |
          from pathlib import Path

          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      0.2.0', '// @version      0.2.1', 1)

          old_key = "        activityCache: 'slinkyLeveling.activityCache.v1'\n"
          new_key = "        activityCache: 'slinkyLeveling.activityCache.v1',\n        panelPosition: 'slinkyLeveling.panelPosition.v1'\n"
          if old_key not in text:
              raise SystemExit('Could not find activityCache key insertion point.')
          text = text.replace(old_key, new_key, 1)

          old_style = "            .slp-head { display:flex; align-items:center; gap:7px; padding:8px 9px; border-bottom:1px solid rgba(255,255,255,.1); }"
          new_style = "            .slp-head { display:flex; align-items:center; gap:7px; padding:8px 9px; border-bottom:1px solid rgba(255,255,255,.1); cursor:move; user-select:none; }"
          if old_style not in text:
              raise SystemExit('Could not find header style insertion point.')
          text = text.replace(old_style, new_style, 1)

          old_start = "    async function start() {\n        installStyles();\n\n        state.leader = TornLib.createTabLeaderLease('slinky-leveling-targets', {"
          new_start = "    async function start() {\n        installStyles();\n\n        const panel = ensurePanel();\n        TornLib.makePanelDraggable(panel, {\n            handle: panel,\n            storageKey: KEYS.panelPosition,\n            ignoreSelector: 'button, input, textarea, select, a, .slp-body, .slp-footer, [data-no-drag]',\n            margin: 4\n        });\n\n        state.leader = TornLib.createTabLeaderLease('slinky-leveling-targets', {"
          if old_start not in text:
              raise SystemExit('Could not find start() insertion point.')
          text = text.replace(old_start, new_start, 1)

          path.write_text(text, encoding='utf-8')

      - name: Syntax check
        run: node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js

      - name: Commit patched prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Add free movement to leveling target panel"
          git push
