name: Apply Slinky Poll Rotation Fix

on:
  push:
    branches:
      - feature/slinky-poll-rotation-fix
    paths:
      - '.github/workflows/apply-slinky-poll-rotation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slinky-poll-rotation-fix

      - name: Raise configurable polling limits
        shell: python
        run: |
          from pathlib import Path

          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      0.4.2', '// @version      0.4.3', 1)
          text = text.replace("primaryChecks: clamp(Number(GM_getValue(KEYS.primaryChecks, PRIMARY_DEFAULT_CHECKS)) || PRIMARY_DEFAULT_CHECKS, 5, 40)", "primaryChecks: clamp(Number(GM_getValue(KEYS.primaryChecks, PRIMARY_DEFAULT_CHECKS)) || PRIMARY_DEFAULT_CHECKS, 5, 80)", 1)
          text = text.replace("backgroundChecks: clamp(Number(GM_getValue(KEYS.backgroundChecks, BACKGROUND_DEFAULT_CHECKS)) || 0, 0, 20)", "backgroundChecks: clamp(Number(GM_getValue(KEYS.backgroundChecks, BACKGROUND_DEFAULT_CHECKS)) || 0, 0, 80)", 1)
          text = text.replace("GM_setValue(KEYS.primaryChecks, clamp(Number(values.primaryChecks) || PRIMARY_DEFAULT_CHECKS, 5, 40));", "GM_setValue(KEYS.primaryChecks, clamp(Number(values.primaryChecks) || PRIMARY_DEFAULT_CHECKS, 5, 80));", 1)
          text = text.replace("GM_setValue(KEYS.backgroundChecks, clamp(Number(values.backgroundChecks) || 0, 0, 20));", "GM_setValue(KEYS.backgroundChecks, clamp(Number(values.backgroundChecks) || 0, 0, 80));", 1)
          text = text.replace('id="slp-primary-checks" type="number" min="5" max="40"', 'id="slp-primary-checks" type="number" min="5" max="80"', 1)
          text = text.replace('id="slp-background-checks" type="number" min="0" max="20"', 'id="slp-background-checks" type="number" min="0" max="80"', 1)
          text = text.replace("scriptVersion: '0.4.2'", "scriptVersion: '0.4.3'", 1)

          path.write_text(text, encoding='utf-8')

      - name: Syntax check and commit
        run: |
          node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Allow up to 80 target checks per poll"
          git push origin HEAD:feature/slinky-poll-rotation-fix
