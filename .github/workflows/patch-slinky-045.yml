name: Patch Slinky Smart Scheduler 0.5.0

on:
  push:
    branches:
      - feature/slinky-smart-scheduler-045
    paths:
      - '.github/workflows/patch-slinky-045.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine status detection and rapid competition handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')

          old = """        return {\n            state: normalizeStatus(stateValue),\n            description: String(status?.description ?? status?.details ?? stateValue ?? 'Unknown'),\n            until: Number(status?.until) || 0\n        };"""
          new = """        const description = String(status?.description ?? status?.details ?? stateValue ?? 'Unknown');\n        return {\n            state: normalizeStatus(`${stateValue} ${description}`),\n            description,\n            until: Number(status?.until) || 0\n        };"""
          if old not in text:
              raise SystemExit('Could not find getUserStatus return block')
          text = text.replace(old, new, 1)

          old = """    function heavilyContested(id) {\n        const fastestGap = fastestRapidHospitalGap24h(id);\n        return hospitalCount24h(id) >= 8 || (fastestGap > 0 && fastestGap <= 5 * 60 * 1000) || competitionScore(id) >= 80;\n    }"""
          new = """    function heavilyContested(id) {\n        const rapidWithinFiveMinutes = rapidHospitalEvents24h(id)\n            .some(event => Number(event.gapMs) <= 5 * 60 * 1000);\n        return hospitalCount24h(id) >= 8 || rapidWithinFiveMinutes || competitionScore(id) >= 80;\n    }"""
          if old not in text:
              raise SystemExit('Could not find heavilyContested block')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check userscript
        run: node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
      - name: Commit refined userscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          if git diff --cached --quiet; then
            echo "No userscript changes."
          else
            git commit -m "Refine smart scheduler status detection"
            git push
          fi
