name: Merge Torn Cracking Passwords

on:
  schedule:
    # 14:00 UTC is 8:00 AM in Denver during daylight-saving time.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torn-cracking-password-merge
  cancel-in-progress: false

jobs:
  merge-passwords:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, validate, and merge submissions
        env:
          RESPONSE_CSV_URL: >-
            https://docs.google.com/spreadsheets/d/1JSn1haBkdaB0jKlotgMJDebOs66ys7wH0kMACwzrWCs/gviz/tq?tqx=out:csv&sheet=Form%20Responses%201
          MASTER_FILE: Torn_Cracking_Combined_Passwords.txt
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import io
          import os
          import re
          import urllib.request
          from pathlib import Path

          csv_url = os.environ["RESPONSE_CSV_URL"]
          master_path = Path(os.environ["MASTER_FILE"])
          valid_password = re.compile(r"^[A-Z0-9_.]{4,10}$")

          # Load and normalize the existing public dictionary.
          existing = set()
          if master_path.exists():
              for raw_line in master_path.read_text(encoding="utf-8").splitlines():
                  password = raw_line.strip().upper()
                  if valid_password.fullmatch(password):
                      existing.add(password)

          # Download the current Google Form response sheet as live CSV.
          request = urllib.request.Request(
              csv_url,
              headers={"User-Agent": "Considious-Torn-Dictionary-Updater/1.0"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              csv_text = response.read().decode("utf-8-sig")

          reader = csv.DictReader(io.StringIO(csv_text))
          if "Password Submission" not in (reader.fieldnames or []):
              raise RuntimeError(
                  "The response sheet is missing the 'Password Submission' column."
              )

          accepted_from_form = set()
          rejected = []

          for row_number, row in enumerate(reader, start=2):
              batch = row.get("Password Submission") or ""

              # A Form response may contain one password or a newline-separated batch.
              for raw_entry in batch.splitlines():
                  password = raw_entry.strip().upper()
                  if not password:
                      continue
                  if valid_password.fullmatch(password):
                      accepted_from_form.add(password)
                  else:
                      rejected.append((row_number, raw_entry))

          new_passwords = accepted_from_form - existing
          merged = existing | accepted_from_form

          print(f"Existing valid passwords: {len(existing):,}")
          print(f"Valid submitted passwords: {len(accepted_from_form):,}")
          print(f"New unique passwords: {len(new_passwords):,}")
          print(f"Rejected malformed entries: {len(rejected):,}")

          if rejected:
              print("Rejected entries:")
              for row_number, value in rejected[:100]:
                  print(f"  Sheet row {row_number}: {value!r}")
              if len(rejected) > 100:
                  print(f"  ...and {len(rejected) - 100} more")

          if new_passwords:
              master_path.write_text(
                  "\n".join(sorted(merged)) + "\n",
                  encoding="utf-8",
              )

              Path("new-passwords-summary.txt").write_text(
                  "\n".join(sorted(new_passwords)) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Commit dictionary update
        shell: bash
        run: |
          if git diff --quiet -- Torn_Cracking_Combined_Passwords.txt; then
            echo "No new passwords to commit."
            exit 0
          fi

          new_count="$(wc -l < new-passwords-summary.txt | tr -d ' ')"

          git config user.name "Considious Dictionary Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Torn_Cracking_Combined_Passwords.txt
          git commit -m "Add ${new_count} submitted Torn cracking passwords"
          git push

      - name: Upload new-password review list
        if: ${{ hashFiles('new-passwords-summary.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: new-cracking-passwords
          path: new-passwords-summary.txt
          retention-days: 30
