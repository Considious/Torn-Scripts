name: Fix Slinky Storage Compatibility

on:
  push:
    branches:
      - feature/slinky-hospital-priority
    paths:
      - '.github/workflows/fix-slinky-storage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slinky-hospital-priority
      - name: Apply hospitalization priority patch
        run: python Slinkies-Leveling-Targets/tools/patch_hospital_priority.py
      - name: Syntax check and commit
        run: |
          node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Track hospitalization frequency for target priority"
          git push origin HEAD:feature/slinky-hospital-priority
