name: Fix Slinky Storage Compatibility

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch prototype
        shell: python
        run: |
          from pathlib import Path

          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      0.2.1', '// @version      0.2.2', 1)

          old = """    function loadJson(key, fallback) {
        try {
            return TornLib.readJsonStorage(key, { fallback, merge: false }) ?? fallback;
        } catch {
            return fallback;
        }
    }
"""
          new = """    function loadJson(key, fallback) {
        try {
            return TornLib.readJsonStorage(key, fallback, { merge: false }) ?? fallback;
        } catch {
            return fallback;
        }
    }
"""

          if old not in text:
              raise SystemExit('loadJson block not found; refusing to patch blindly')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m 'Fix Slinky JSON storage fallback handling'
          git push
