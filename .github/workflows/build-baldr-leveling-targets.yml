name: Build Baldr Leveling Targets

on:
  push:
    paths:
      - 'Slinkies-Leveling-Targets/tools/build_baldr.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Baldr CSV
        run: python Slinkies-Leveling-Targets/tools/build_baldr.py

      - name: Commit generated CSV
        run: |
          if [ -z "$(git status --porcelain -- Slinkies-Leveling-Targets/Baldrs.csv)" ]; then
            echo "Baldrs.csv is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Baldrs.csv
          git commit -m "Build Baldr leveling targets CSV"
          git push
