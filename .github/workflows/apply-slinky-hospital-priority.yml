name: Apply Slinky Hospital Priority

# One-shot branch patch workflow.
on:
  push:
    branches:
      - feature/slinky-hospital-priority
    paths:
      - '.github/workflows/apply-slinky-hospital-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slinky-hospital-priority

      - name: Patch hospitalization tracking
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      0.4.0', '// @version      0.4.1', 1)
          text = text.replace('    const HISTORY_WINDOW_MS = 24 * 60 * 60 * 1000;\n', '    const HOSPITAL_24H_MS = 24 * 60 * 60 * 1000;\n    const HOSPITAL_7D_MS = 7 * 24 * 60 * 60 * 1000;\n', 1)

          text = text.replace('        const cutoff = Date.now() - HISTORY_WINDOW_MS;', '        const cutoff = Date.now() - HOSPITAL_7D_MS;', 2)

          old = '''    function hospitalCount24h(id) {\n        return getHospitalRecord(id).events.length;\n    }\n\n'''
          new = '''    function hospitalCount24h(id) {\n        const cutoff = Date.now() - HOSPITAL_24H_MS;\n        return getHospitalRecord(id).events.filter(timestamp => timestamp >= cutoff).length;\n    }\n\n    function hospitalCount7d(id) {\n        return getHospitalRecord(id).events.length;\n    }\n\n'''
          if old not in text:
              raise SystemExit('hospitalCount24h anchor not found')
          text = text.replace(old, new, 1)

          old = '''        const beforeHospitalCount = hospitalCount24h(target.id);\n        noteStatusObservation(target.id, status.state);\n        const afterHospitalCount = hospitalCount24h(target.id);\n\n        state.observationLog.push({\n            checkedAt: now,\n            id: target.id,\n            name: target.name,\n            level: target.level,\n            total: target.total,\n            sources: target.sources,\n            status: status.state,\n            description: status.description,\n            until: status.until || 0,\n            hospitalizationObserved: afterHospitalCount > beforeHospitalCount\n        });\n\n        if (state.observationLog.length > MAX_OBSERVATION_LOG) {\n            state.observationLog.splice(0, state.observationLog.length - MAX_OBSERVATION_LOG);\n        }\n\n        // Persist every completed observation immediately so a refresh mid-cycle\n        // cannot throw away data already collected.\n        saveJson(KEYS.statusCache, state.statusCache);\n        saveJson(KEYS.hospitalHistory, state.hospitalHistory);\n        saveJson(KEYS.observationLog, state.observationLog);\n'''
          new = '''        noteStatusObservation(target.id, status.state);\n\n        // Current status remains local operational state. Only hospitalization\n        // transitions are retained as long-term competition intelligence.\n        saveJson(KEYS.statusCache, state.statusCache);\n        saveJson(KEYS.hospitalHistory, state.hospitalHistory);\n'''
          if old not in text:
              raise SystemExit('observation logging block not found')
          text = text.replace(old, new, 1)

          old = '''        return {\n            blocked: blocked ? 1 : 0,\n            hospitalCount: record.events.length,\n            recentHospitalPenalty: lastHosp ? Math.max(0, HISTORY_WINDOW_MS - (Date.now() - lastHosp)) : 0,\n            level: target.level,\n'''
          new = '''        return {\n            blocked: blocked ? 1 : 0,\n            hospital24h: hospitalCount24h(target.id),\n            hospital7d: hospitalCount7d(target.id),\n            recentHospitalPenalty: lastHosp ? Math.max(0, HOSPITAL_7D_MS - (Date.now() - lastHosp)) : 0,\n            level: target.level,\n'''
          if old not in text:
              raise SystemExit('priority tuple anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('        if (A.hospitalCount !== B.hospitalCount) return A.hospitalCount - B.hospitalCount;\n', '        if (A.hospital24h !== B.hospital24h) return A.hospital24h - B.hospital24h;\n        if (A.hospital7d !== B.hospital7d) return A.hospital7d - B.hospital7d;\n', 1)

          old = '''                const Ah = hospitalCount24h(a.id);\n                const Bh = hospitalCount24h(b.id);\n                if (Ah !== Bh) return Ah - Bh;\n\n'''
          new = '''                const A24 = hospitalCount24h(a.id);\n                const B24 = hospitalCount24h(b.id);\n                if (A24 !== B24) return A24 - B24;\n\n                const A7 = hospitalCount7d(a.id);\n                const B7 = hospitalCount7d(b.id);\n                if (A7 !== B7) return A7 - B7;\n\n'''
          if old not in text:
              raise SystemExit('display sort hospitalization anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace("            scriptVersion: '0.4.0',", "            scriptVersion: '0.4.1',", 1)
          text = text.replace('            observationsLogged: Array.isArray(state.observationLog) ? state.observationLog.length : 0,\n', '            hospitalizedTargets: Object.keys(state.hospitalHistory || {}).filter(id => hospitalCount7d(id) > 0).length,\n            hospitalizationEvents7d: Object.keys(state.hospitalHistory || {}).reduce((sum, id) => sum + hospitalCount7d(id), 0),\n', 1)
          text = text.replace('            `Status observations logged: ${data.observationsLogged}`,\n', '            `Targets hospitalized in 7d: ${data.hospitalizedTargets}`,\n            `Hospitalization events observed in 7d: ${data.hospitalizationEvents7d}`,\n', 1)
          text = text.replace('                    <div class="slp-debug-line"><span>Observations</span><b>${data.observationsLogged}</b></div>\n', '                    <div class="slp-debug-line"><span>Hosp targets 7d</span><b>${data.hospitalizedTargets}</b></div>\n                    <div class="slp-debug-line"><span>Hosp events 7d</span><b>${data.hospitalizationEvents7d}</b></div>\n', 1)

          start = text.find('    function exportObservationCsv() {')
          end = text.find('    function exportTargetCacheCsv() {', start)
          if start == -1 or end == -1:
              raise SystemExit('export observation function anchors not found')
          replacement = r'''    function exportHospitalizationSummaryCsv() {
        refreshCollectedDataFromStorage();

        const headers = [
            'id', 'name', 'level', 'total', 'sources',
            'hospitalizations_24h', 'hospitalizations_7d',
            'last_hospitalized_at', 'last_status', 'last_status_checked_at'
        ];

        const rows = state.master
            .map(target => {
                const count24 = hospitalCount24h(target.id);
                const count7 = hospitalCount7d(target.id);
                const lastHosp = lastHospitalizedAt(target.id);
                const status = state.statusCache[target.id] || {};

                return {
                    id: target.id,
                    name: target.name,
                    level: target.level,
                    total: target.total,
                    sources: target.sources,
                    hospitalizations_24h: count24,
                    hospitalizations_7d: count7,
                    last_hospitalized_at: lastHosp ? new Date(lastHosp).toISOString() : '',
                    last_status: status.state || '',
                    last_status_checked_at: status.checkedAt ? new Date(status.checkedAt).toISOString() : ''
                };
            })
            .filter(row => row.hospitalizations_7d > 0)
            .sort((a, b) =>
                b.hospitalizations_24h - a.hospitalizations_24h ||
                b.hospitalizations_7d - a.hospitalizations_7d ||
                String(b.last_hospitalized_at).localeCompare(String(a.last_hospitalized_at))
            );

        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
        downloadCsv(`Slinky-Leveling-Hospitalization-Summary-${stamp}.csv`, headers, rows);
    }

'''
          text = text[:start] + replacement + text[end:]

          text = text.replace('<button class="slp-btn" id="slp-export-observations">Export Observations CSV</button>', '<button class="slp-btn" id="slp-export-hospitalizations">Export Hospitalizations CSV</button>', 1)
          text = text.replace("        panel.querySelector('#slp-export-observations')?.addEventListener('click', () => exportObservationCsv());", "        panel.querySelector('#slp-export-hospitalizations')?.addEventListener('click', () => exportHospitalizationSummaryCsv());", 1)

          text = text.replace('                        <span class="slp-badge ${hospCount ? \'slp-hosp-hot\' : \'\'}">Hosp 24h: ${hospCount}</span>', '                        <span class="slp-badge ${hospCount ? \'slp-hosp-hot\' : \'\'}">Hosp 24h: ${hospCount}</span>\n                        <span class="slp-badge ${hospitalCount7d(target.id) ? \'slp-hosp-hot\' : \'\'}">7d: ${hospitalCount7d(target.id)}</span>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check and commit
        run: |
          node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Track hospitalization frequency for target priority"
          git push origin HEAD:feature/slinky-hospital-priority
