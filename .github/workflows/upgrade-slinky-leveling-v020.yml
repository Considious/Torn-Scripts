name: Upgrade Slinky Leveling v0.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-slinky-leveling-v020.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged patch
        run: |
          sha256sum Slinkies-Leveling-Targets/.tmp/v020.patch.b64.*
          cat Slinkies-Leveling-Targets/.tmp/v020.patch.b64.* > /tmp/v020.patch.b64
          sha256sum /tmp/v020.patch.b64
          base64 -d /tmp/v020.patch.b64 > /tmp/v020.patch
          sha256sum /tmp/v020.patch
          git apply --check /tmp/v020.patch
