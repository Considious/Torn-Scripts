name: Upgrade Slinky Leveling v0.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-slinky-leveling-v020.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade prototype
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected source block: {old[:90]!r}')
              s = s.replace(old, new, 1)

          rep('// @version      0.1.0', '// @version      0.2.0')
          rep('// @description  API-only leveling target prototype using the Slinkies master list, Torn status checks, FFScouter estimates, and local hospitalization history.',
              '// @description  Leveling target prototype using daily activity snapshots, prioritized Torn status checks, FFScouter estimates, and local hospitalization history.')

          rep("    const HISTORY_WINDOW_MS = 24 * 60 * 60 * 1000;\n    const OKAY_CACHE_MS = 5 * 60 * 1000;\n    const NON_OKAY_RECHECK_MS = 5 * 60 * 1000;\n    const FF_CACHE_MS = 12 * 60 * 60 * 1000;\n    const MASTER_CACHE_MS = 30 * 60 * 1000;\n    const MAX_DISPLAY = 40;",
              "    const HISTORY_WINDOW_MS = 24 * 60 * 60 * 1000;\n    const ACTIVITY_WINDOW_DAYS = 7;\n    const ACTIVITY_REFRESH_MS = 24 * 60 * 60 * 1000;\n    const OKAY_CACHE_MS = 5 * 60 * 1000;\n    const NON_OKAY_RECHECK_MS = 5 * 60 * 1000;\n    const FF_CACHE_MS = 12 * 60 * 60 * 1000;\n    const MASTER_CACHE_MS = 30 * 60 * 1000;\n    const PRIMARY_CHECKS = 40;\n    const BACKGROUND_DEFAULT_CHECKS = 10;\n    const BACKGROUND_POLL_MS = 5 * 60 * 1000;\n    const MAX_DISPLAY = 40;")

          rep("        checksPerCycle: 'slinkyLeveling.checksPerCycle',", "        backgroundChecks: 'slinkyLeveling.backgroundChecks',")
          rep("        masterCache: 'slinkyLeveling.masterCache.v1'", "        masterCache: 'slinkyLeveling.masterCache.v1',\n        activityCache: 'slinkyLeveling.activityCache.v1'")
          rep("        hospitalHistory: loadJson(KEYS.hospitalHistory, {}),\n        polling: false,",
              "        hospitalHistory: loadJson(KEYS.hospitalHistory, {}),\n        activityCache: loadJson(KEYS.activityCache, { refreshedAt: 0, activeTargets: {}, snapshots: [] }),\n        polling: false,\n        backgroundPolling: false,")
          rep("        lastCycleOkay: 0,\n        lastError: '',", "        lastCycleOkay: 0,\n        lastBackgroundAt: 0,\n        lastBackgroundChecked: 0,\n        lastError: '',")
          rep("        timer: null,\n        leader: null", "        timer: null,\n        backgroundTimer: null,\n        leader: null")

          rep("            checksPerCycle: clamp(Number(GM_getValue(KEYS.checksPerCycle, 40)) || 40, 10, 40),",
              "            backgroundChecks: clamp(Number(GM_getValue(KEYS.backgroundChecks, BACKGROUND_DEFAULT_CHECKS)) || BACKGROUND_DEFAULT_CHECKS, 10, 40),")
          rep("        GM_setValue(KEYS.checksPerCycle, clamp(Number(values.checksPerCycle) || 40, 10, 40));",
              "        GM_setValue(KEYS.backgroundChecks, clamp(Number(values.backgroundChecks) || BACKGROUND_DEFAULT_CHECKS, 10, 40));")

          activity = r'''    // ─────────────────────────────────────────────────────────────
    // Seven-day activity snapshot cache
    // ─────────────────────────────────────────────────────────────

    function activitySnapshotTimestamp(daysAgo) {
        const date = new Date();
        date.setUTCHours(12, 0, 0, 0);
        date.setUTCDate(date.getUTCDate() - daysAgo);
        return Math.floor(date.getTime() / 1000);
    }

    function parseSnapshotActiveTargets(text, masterIds, snapshotTimestamp, activeTargets) {
        const lines = String(text || '').split(/\r?\n/);
        for (let index = 1; index < lines.length; index++) {
            const match = lines[index].match(/^\s*"?(\d+)"?\s*,/);
            if (!match) continue;
            const id = match[1];
            if (!masterIds.has(id)) continue;
            activeTargets[id] = Math.max(Number(activeTargets[id]) || 0, snapshotTimestamp);
        }
    }

    async function ensureActivitySnapshots(apiKey, force = false) {
        const cache = state.activityCache || {};
        const fresh = Number(cache.refreshedAt) > 0 &&
            Date.now() - Number(cache.refreshedAt) < ACTIVITY_REFRESH_MS &&
            cache.activeTargets && typeof cache.activeTargets === 'object';
        if (!force && fresh) return cache;
        if (!state.master.length) await loadMaster(false);

        const masterIds = new Set(state.master.map(target => target.id));
        const activeTargets = {};
        const snapshots = [];
        for (let daysAgo = 0; daysAgo < ACTIVITY_WINDOW_DAYS; daysAgo++) {
            const timestamp = activitySnapshotTimestamp(daysAgo);
            const url = `https://api.torn.com/v2/user/snapshot?timestamp=${timestamp}`;
            const csv = await TornLib.requestText(url, {
                headers: { Authorization: `ApiKey ${apiKey}` },
                timeout: 30_000,
                tornScript: SCRIPT_NAME,
                tornPriority: 'background',
                tornLimit: TornLib.TORN_API_DEFAULT_LIMIT,
                tornWait: true,
                tornMaxWaitMs: 65_000,
                networkErrorMessage: 'Could not load Torn daily activity snapshot.'
            });
            parseSnapshotActiveTargets(csv, masterIds, timestamp, activeTargets);
            snapshots.push(timestamp);
        }

        state.activityCache = { refreshedAt: Date.now(), activeTargets, snapshots };
        saveJson(KEYS.activityCache, state.activityCache);
        return state.activityCache;
    }

    function activeWithinSevenDays(id) {
        return Boolean(state.activityCache?.activeTargets?.[id]);
    }

    function activeExcludedCount() {
        return Object.keys(state.activityCache?.activeTargets || {}).length;
    }

'''
          marker = "    // ─────────────────────────────────────────────────────────────\n    // Hospitalization history\n    // ─────────────────────────────────────────────────────────────\n"
          rep(marker, activity + marker)

          rep("    async function getUserStatus(apiKey, target) {", "    async function getUserStatus(apiKey, target, priority = 'normal') {")
          rep("            tornPriority: 'normal',", "            tornPriority: priority,")

          old_choose = '''    function chooseCandidates(limit) {
        const now = Date.now();

        return [...state.master]
            .filter(target => {
                const cached = state.statusCache[target.id];
                return !cached?.nextEligibleAt || cached.nextEligibleAt <= now;
            })
            .sort(compareCandidates)
            .slice(0, limit);
    }
'''
          new_choose = '''    function candidateEligible(target, now = Date.now()) {
        if (activeWithinSevenDays(target.id)) return false;
        const cached = state.statusCache[target.id];
        return !cached?.nextEligibleAt || cached.nextEligibleAt <= now;
    }

    function chooseCandidates(limit) {
        const now = Date.now();
        return [...state.master]
            .filter(target => candidateEligible(target, now))
            .sort(compareCandidates)
            .slice(0, limit);
    }

    function chooseBackgroundCandidates(limit, excludeIds = new Set()) {
        const now = Date.now();
        return [...state.master]
            .filter(target => !excludeIds.has(target.id) && candidateEligible(target, now))
            .sort((a, b) => {
                const checkedA = Number(state.statusCache[a.id]?.checkedAt) || 0;
                const checkedB = Number(state.statusCache[b.id]?.checkedAt) || 0;
                if (checkedA !== checkedB) return checkedA - checkedB;
                return compareCandidates(a, b);
            })
            .slice(0, limit);
    }
'''
          rep(old_choose, new_choose)
          rep("            .filter(target => {\n                const status = state.statusCache[target.id];",
              "            .filter(target => {\n                if (activeWithinSevenDays(target.id)) return false;\n\n                const status = state.statusCache[target.id];")

          rep("            cleanHospitalHistory();\n            if (!state.master.length || force) await loadMaster(force);\n\n            const candidates = chooseCandidates(settings.checksPerCycle);",
              "            cleanHospitalHistory();\n            if (!state.master.length || force) await loadMaster(force);\n            await ensureActivitySnapshots(settings.tornKey, false);\n\n            const candidates = chooseCandidates(PRIMARY_CHECKS);")
          rep("                    const status = await getUserStatus(settings.tornKey, target);",
              "                    const status = await getUserStatus(settings.tornKey, target, 'normal');")

          background = '''    async function backgroundPoll() {
        if (state.backgroundPolling || state.polling) {
            scheduleBackgroundPoll();
            return;
        }
        if (!state.leader?.isLeader()) {
            scheduleBackgroundPoll();
            return;
        }

        const settings = getSettings();
        if (!settings.tornKey) {
            scheduleBackgroundPoll();
            return;
        }

        state.backgroundPolling = true;
        try {
            if (!state.master.length) await loadMaster(false);
            await ensureActivitySnapshots(settings.tornKey, false);

            const primaryIds = new Set(chooseCandidates(PRIMARY_CHECKS).map(target => target.id));
            const candidates = chooseBackgroundCandidates(settings.backgroundChecks, primaryIds);
            state.lastBackgroundChecked = candidates.length;
            const results = await Promise.allSettled(candidates.map(async target => {
                const status = await getUserStatus(settings.tornKey, target, 'background');
                updateStatusCache(target, status);
                return { target, status };
            }));

            const okayTargets = results
                .filter(result => result.status === 'fulfilled')
                .map(result => result.value)
                .filter(result => statusIsOkay(result.status.state))
                .map(result => result.target);

            if (settings.ffKey && okayTargets.length) {
                try {
                    await updateFFScouter(settings.ffKey, okayTargets);
                } catch (error) {
                    console.warn('[Slinky Leveling] Background FFScouter update failed:', error);
                }
            }

            state.lastBackgroundAt = Date.now();
            saveJson(KEYS.statusCache, state.statusCache);
            saveJson(KEYS.hospitalHistory, state.hospitalHistory);
            saveJson(KEYS.ffCache, state.ffCache);
        } catch (error) {
            console.warn('[Slinky Leveling] Background poll failed:', error);
        } finally {
            state.backgroundPolling = false;
            scheduleBackgroundPoll();
            render();
        }
    }

    function scheduleBackgroundPoll() {
        if (state.backgroundTimer) clearTimeout(state.backgroundTimer);
        state.backgroundTimer = setTimeout(() => backgroundPoll(), BACKGROUND_POLL_MS);
    }

'''
          rep("    function scheduleNextPoll() {\n", background + "    function scheduleNextPoll() {\n")

          rep(".slp-summary { display:grid; grid-template-columns:repeat(3, 1fr);", ".slp-summary { display:grid; grid-template-columns:repeat(4, 1fr);")
          rep('                    <div class="slp-stat"><b>${state.lastCycleChecked}</b><span>Checked</span></div>\n                    <div class="slp-stat"><b>${usage.count}/${usage.limit}</b><span>API / min</span></div>',
              '                    <div class="slp-stat"><b>${state.lastCycleChecked}</b><span>Primary</span></div>\n                    <div class="slp-stat"><b>${activeExcludedCount()}</b><span>Active &lt;7d</span></div>\n                    <div class="slp-stat"><b>${usage.count}/${usage.limit}</b><span>API / min</span></div>')
          rep("                Hospital hits are local observations, rolling 24h. Last cycle: ${state.lastCycleAt ? escapeHtml(humanAgo(state.lastCycleAt)) : 'Never'}.",
              "                7-day activity snapshots exclude recent players from polling. Hospital hits are local 24h observations. Primary: ${state.lastCycleAt ? escapeHtml(humanAgo(state.lastCycleAt)) : 'Never'} · Background: ${state.lastBackgroundAt ? escapeHtml(humanAgo(state.lastBackgroundAt)) : 'Never'} (${state.lastBackgroundChecked}).")
          rep('                <label>Checks / cycle\n                    <input id="slp-checks" type="number" min="10" max="40" value="${settings.checksPerCycle}">\n                </label>',
              '                <label>Background checks\n                    <input id="slp-background-checks" type="number" min="10" max="40" value="${settings.backgroundChecks}">\n                </label>')
          rep("                checksPerCycle: panel.querySelector('#slp-checks')?.value,", "                backgroundChecks: panel.querySelector('#slp-background-checks')?.value,")
          rep("            state.ffCache = {};\n\n            saveJson(KEYS.hospitalHistory, {});",
              "            state.ffCache = {};\n            state.activityCache = { refreshedAt: 0, activeTargets: {}, snapshots: [] };\n\n            saveJson(KEYS.hospitalHistory, {});")
          rep("            saveJson(KEYS.ffCache, {});\n            render();", "            saveJson(KEYS.ffCache, {});\n            saveJson(KEYS.activityCache, state.activityCache);\n            render();")
          rep("                if (isLeader) poll(false);", "                if (isLeader) {\n                    poll(false);\n                    scheduleBackgroundPoll();\n                }")
          rep("        if (state.leader.isLeader()) poll(false);\n        else scheduleNextPoll();",
              "        if (state.leader.isLeader()) {\n            poll(false);\n            scheduleBackgroundPoll();\n        } else {\n            scheduleNextPoll();\n            scheduleBackgroundPoll();\n        }")

          p.write_text(s, encoding='utf-8')
          PY
          node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Add 7-day activity filter and background target polling"
          git push
