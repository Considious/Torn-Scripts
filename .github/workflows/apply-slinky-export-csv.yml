name: Apply Slinky CSV Export

on:
  push:
    branches:
      - feature/slinky-export-csv
    paths:
      - '.github/workflows/apply-slinky-export-csv.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slinky-export-csv

      - name: Patch userscript CSV export and observation history
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      0.3.2', '// @version      0.4.0', 1)

          text = text.replace(
              "    const MAX_DISPLAY = 40;\n",
              "    const MAX_DISPLAY = 40;\n    const MAX_OBSERVATION_LOG = 20_000;\n",
              1,
          )

          text = text.replace(
              "        runtimeState: 'slinkyLeveling.runtimeState.v1'\n",
              "        runtimeState: 'slinkyLeveling.runtimeState.v1',\n        observationLog: 'slinkyLeveling.observationLog.v1'\n",
              1,
          )

          text = text.replace(
              "        activityCache: loadJson(KEYS.activityCache, { refreshedAt: 0, activeTargets: {}, snapshots: [] }),\n",
              "        activityCache: loadJson(KEYS.activityCache, { refreshedAt: 0, activeTargets: {}, snapshots: [] }),\n        observationLog: loadJson(KEYS.observationLog, []),\n",
              1,
          )

          refresh_anchor = """        const storedActivity = loadJson(KEYS.activityCache, null);\n        const storedRuntime = loadJson(KEYS.runtimeState, {});\n"""
          refresh_repl = """        const storedActivity = loadJson(KEYS.activityCache, null);\n        const storedRuntime = loadJson(KEYS.runtimeState, {});\n        const storedObservations = loadJson(KEYS.observationLog, []);\n"""
          if refresh_anchor not in text:
              raise SystemExit('Refresh storage anchor not found')
          text = text.replace(refresh_anchor, refresh_repl, 1)

          merge_anchor = """        if (storedActivity && Number(storedActivity.refreshedAt) > Number(state.activityCache?.refreshedAt || 0)) {\n            state.activityCache = storedActivity;\n        }\n\n        state.lastCycleAt = Math.max"""
          merge_repl = """        if (storedActivity && Number(storedActivity.refreshedAt) > Number(state.activityCache?.refreshedAt || 0)) {\n            state.activityCache = storedActivity;\n        }\n        if (Array.isArray(storedObservations) && storedObservations.length > state.observationLog.length) {\n            state.observationLog = storedObservations;\n        }\n\n        state.lastCycleAt = Math.max"""
          if merge_anchor not in text:
              raise SystemExit('Observation merge anchor not found')
          text = text.replace(merge_anchor, merge_repl, 1)

          update_anchor = """        noteStatusObservation(target.id, status.state);\n\n        // Persist every completed observation immediately so a refresh mid-cycle\n        // cannot throw away data already collected.\n        saveJson(KEYS.statusCache, state.statusCache);\n        saveJson(KEYS.hospitalHistory, state.hospitalHistory);\n"""
          update_repl = """        const beforeHospitalCount = hospitalCount24h(target.id);\n        noteStatusObservation(target.id, status.state);\n        const afterHospitalCount = hospitalCount24h(target.id);\n\n        state.observationLog.push({\n            checkedAt: now,\n            id: target.id,\n            name: target.name,\n            level: target.level,\n            total: target.total,\n            sources: target.sources,\n            status: status.state,\n            description: status.description,\n            until: status.until || 0,\n            hospitalizationObserved: afterHospitalCount > beforeHospitalCount\n        });\n\n        if (state.observationLog.length > MAX_OBSERVATION_LOG) {\n            state.observationLog.splice(0, state.observationLog.length - MAX_OBSERVATION_LOG);\n        }\n\n        // Persist every completed observation immediately so a refresh mid-cycle\n        // cannot throw away data already collected.\n        saveJson(KEYS.statusCache, state.statusCache);\n        saveJson(KEYS.hospitalHistory, state.hospitalHistory);\n        saveJson(KEYS.observationLog, state.observationLog);\n"""
          if update_anchor not in text:
              raise SystemExit('Status observation anchor not found')
          text = text.replace(update_anchor, update_repl, 1)

          debug_return_anchor = """            ffScouterRecords: Object.keys(state.ffCache || {}).length,\n            activitySnapshotRefreshedAt:"""
          debug_return_repl = """            ffScouterRecords: Object.keys(state.ffCache || {}).length,\n            observationsLogged: Array.isArray(state.observationLog) ? state.observationLog.length : 0,\n            activitySnapshotRefreshedAt:"""
          if debug_return_anchor not in text:
              raise SystemExit('Debug return anchor not found')
          text = text.replace(debug_return_anchor, debug_return_repl, 1)

          text = text.replace("            scriptVersion: '0.3.2',", "            scriptVersion: '0.4.0',", 1)

          debug_line_anchor = """            `FFScouter cached records: ${data.ffScouterRecords}`,\n            `Activity snapshots cached:"""
          debug_line_repl = """            `FFScouter cached records: ${data.ffScouterRecords}`,\n            `Status observations logged: ${data.observationsLogged}`,\n            `Activity snapshots cached:"""
          if debug_line_anchor not in text:
              raise SystemExit('Debug text anchor not found')
          text = text.replace(debug_line_anchor, debug_line_repl, 1)

          debug_grid_anchor = """                    <div class=\"slp-debug-line\"><span>FF cached</span><b>${data.ffScouterRecords}</b></div>\n                    <div class=\"slp-debug-line\"><span>Okay</span>"""
          debug_grid_repl = """                    <div class=\"slp-debug-line\"><span>FF cached</span><b>${data.ffScouterRecords}</b></div>\n                    <div class=\"slp-debug-line\"><span>Observations</span><b>${data.observationsLogged}</b></div>\n                    <div class=\"slp-debug-line\"><span>Okay</span>"""
          if debug_grid_anchor not in text:
              raise SystemExit('Debug grid anchor not found')
          text = text.replace(debug_grid_anchor, debug_grid_repl, 1)

          action_anchor = """                    <button class=\"slp-btn\" id=\"slp-copy-debug\">Copy Debug Data</button>\n                    <button class=\"slp-btn\" id=\"slp-refresh-debug\">Refresh View</button>\n"""
          action_repl = """                    <button class=\"slp-btn\" id=\"slp-export-observations\">Export Observations CSV</button>\n                    <button class=\"slp-btn\" id=\"slp-export-target-cache\">Export Target Cache CSV</button>\n                    <button class=\"slp-btn\" id=\"slp-copy-debug\">Copy Debug Data</button>\n                    <button class=\"slp-btn\" id=\"slp-refresh-debug\">Refresh View</button>\n"""
          if action_anchor not in text:
              raise SystemExit('Debug actions anchor not found')
          text = text.replace(action_anchor, action_repl, 1)

          functions_anchor = """    function debugHtml() {\n        const data = buildDebugData();\n"""
          functions = r'''    function csvCell(value) {
        const text = String(value ?? '');
        return `"${text.replace(/"/g, '""')}"`;
    }

    function downloadCsv(filename, headers, rows) {
        const lines = [headers.map(csvCell).join(',')];

        for (const row of rows) {
            lines.push(headers.map(header => csvCell(row[header])).join(','));
        }

        const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportObservationCsv() {
        refreshCollectedDataFromStorage();

        const headers = [
            'checked_at', 'id', 'name', 'level', 'total', 'sources',
            'status', 'description', 'status_until', 'hospitalization_observed'
        ];

        const rows = [...state.observationLog]
            .sort((a, b) => Number(a.checkedAt || 0) - Number(b.checkedAt || 0))
            .map(row => ({
                checked_at: row.checkedAt ? new Date(row.checkedAt).toISOString() : '',
                id: row.id || '',
                name: row.name || '',
                level: row.level ?? '',
                total: row.total ?? '',
                sources: row.sources || '',
                status: row.status || '',
                description: row.description || '',
                status_until: row.until ? new Date(Number(row.until) * 1000).toISOString() : '',
                hospitalization_observed: row.hospitalizationObserved ? 'Yes' : 'No'
            }));

        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
        downloadCsv(`Slinky-Leveling-Observations-${stamp}.csv`, headers, rows);
    }

    function exportTargetCacheCsv() {
        refreshCollectedDataFromStorage();

        const headers = [
            'id', 'name', 'level', 'total', 'sources', 'profile_url',
            'active_within_7_days', 'last_seen_active_snapshot',
            'current_status', 'status_description', 'status_checked_at',
            'hospitalizations_observed_24h', 'last_hospitalized_at',
            'fair_fight', 'ff_bs_estimate', 'ff_source', 'ff_checked_at'
        ];

        const rows = state.master.map(target => {
            const status = state.statusCache[target.id] || {};
            const ff = state.ffCache[target.id] || {};
            const lastActive = lastSeenActiveSnapshot(target.id);
            const lastHosp = lastHospitalizedAt(target.id);

            return {
                id: target.id,
                name: target.name,
                level: target.level,
                total: target.total,
                sources: target.sources,
                profile_url: target.profileUrl,
                active_within_7_days: activeWithinSevenDays(target.id) ? 'Yes' : 'No',
                last_seen_active_snapshot: lastActive ? new Date(lastActive * 1000).toISOString() : '',
                current_status: status.state || '',
                status_description: status.description || '',
                status_checked_at: status.checkedAt ? new Date(status.checkedAt).toISOString() : '',
                hospitalizations_observed_24h: hospitalCount24h(target.id),
                last_hospitalized_at: lastHosp ? new Date(lastHosp).toISOString() : '',
                fair_fight: Number.isFinite(Number(ff.fairFight)) ? ff.fairFight : '',
                ff_bs_estimate: ff.bsEstimate ?? '',
                ff_source: ff.source || '',
                ff_checked_at: ff.checkedAt ? new Date(ff.checkedAt).toISOString() : ''
            };
        });

        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
        downloadCsv(`Slinky-Leveling-Target-Cache-${stamp}.csv`, headers, rows);
    }

    function debugHtml() {
        const data = buildDebugData();
'''
          if functions_anchor not in text:
              raise SystemExit('debugHtml anchor not found')
          text = text.replace(functions_anchor, functions, 1)

          bind_anchor = """        panel.querySelector('#slp-copy-debug')?.addEventListener('click', async event => {\n"""
          bind_repl = """        panel.querySelector('#slp-export-observations')?.addEventListener('click', () => {\n            exportObservationCsv();\n        });\n\n        panel.querySelector('#slp-export-target-cache')?.addEventListener('click', () => {\n            exportTargetCacheCsv();\n        });\n\n        panel.querySelector('#slp-copy-debug')?.addEventListener('click', async event => {\n"""
          if bind_anchor not in text:
              raise SystemExit('Bind events anchor not found')
          text = text.replace(bind_anchor, bind_repl, 1)

          clear_anchor = """            state.activityCache = { refreshedAt: 0, activeTargets: {}, snapshots: [] };\n\n            saveJson(KEYS.hospitalHistory, {});\n"""
          clear_repl = """            state.activityCache = { refreshedAt: 0, activeTargets: {}, snapshots: [] };\n            state.observationLog = [];\n\n            saveJson(KEYS.hospitalHistory, {});\n"""
          if clear_anchor not in text:
              raise SystemExit('Clear history anchor not found')
          text = text.replace(clear_anchor, clear_repl, 1)

          clear_save_anchor = """            saveJson(KEYS.activityCache, state.activityCache);\n            render();\n"""
          clear_save_repl = """            saveJson(KEYS.activityCache, state.activityCache);\n            saveJson(KEYS.observationLog, []);\n            render();\n"""
          if clear_save_anchor not in text:
              raise SystemExit('Clear save anchor not found')
          text = text.replace(clear_save_anchor, clear_save_repl, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check and commit
        run: |
          node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Add persistent observation log and CSV exports"
          git push origin HEAD:feature/slinky-export-csv
