name: Apply Slinky CSV Export

on:
  push:
    branches:
      - feature/slinky-export-csv
    paths:
      - '.github/workflows/apply-slinky-export-csv.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slinky-export-csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python Slinkies-Leveling-Targets/tools/patch_export_csv.py
      - name: Check and commit
        run: |
          node --check Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Slinky_Leveling_Target_Prototype.user.js
          git commit -m "Add persistent observation log and CSV exports"
          git push origin HEAD:feature/slinky-export-csv
