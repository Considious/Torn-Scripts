name: Build Netgangster Legacy Targets

on:
  push:
    paths:
      - 'Slinkies-Leveling-Targets/tools/netgangster_legacy.csv.gz.b64'
      - 'Slinkies-Leveling-Targets/tools/build_netgangster_legacy.py'
      - '.github/workflows/build-netgangster-legacy-targets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Netgangster CSV
        run: python Slinkies-Leveling-Targets/tools/build_netgangster_legacy.py

      - name: Commit generated CSV
        run: |
          if git diff --quiet -- Slinkies-Leveling-Targets/Netgangster-Legacy-Leveling-Targets.csv; then
            echo "CSV is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Netgangster-Legacy-Leveling-Targets.csv
          git commit -m "Build Netgangster legacy leveling targets CSV"
          git push
