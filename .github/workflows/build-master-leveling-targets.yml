name: Build Master Leveling Targets

on:
  push:
    branches: [main]
    paths:
      - 'Slinkies-Leveling-Targets/Baldrs.csv'
      - 'Slinkies-Leveling-Targets/Slinky-Leveling-Targets.csv'
      - 'Slinkies-Leveling-Targets/Torn-Forum-Leveling-Targets.csv'
      - 'Slinkies-Leveling-Targets/Netgangster-Legacy-Leveling-Targets.csv'
      - 'Slinkies-Leveling-Targets/tools/build_master_targets.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build master CSV
        run: python Slinkies-Leveling-Targets/tools/build_master_targets.py
      - name: Commit generated master list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Slinkies-Leveling-Targets/Master-Leveling-Targets.csv
          if git diff --cached --quiet; then
            echo "No master list changes."
          else
            git commit -m "Update master leveling targets"
            git push
          fi
